name: Habitacion Llena Architecture CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main, refactor/hotel-os-architecture-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotel-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Product boundaries
        run: npm run check:product-boundaries
      - name: Hotel architecture
        run: npm run check:hotel-architecture
      - name: Production build
        run: npm run build
