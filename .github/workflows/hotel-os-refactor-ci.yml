name: Habitacion Llena Architecture CI

on:
  pull_request:
    branches: [pms-rebuild-zero, staging, main]
  push:
    branches: [pms-rebuild-zero, staging, main, refactor/hotel-os-architecture-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotel-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile matches package.json
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp -s /tmp/package-lock.before.json package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Product boundaries
        run: npm run check:product-boundaries
      - name: PMS enterprise isolation and fixture guard
        run: node scripts/check-pms-next-isolation.mjs
      - name: Hotel architecture
        if: github.head_ref != 'pms-rebuild-zero' && github.ref_name != 'pms-rebuild-zero'
        run: npm run check:hotel-architecture
      - name: Production build
        run: npm run build
